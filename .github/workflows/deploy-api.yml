name: Deploy API to Azure Container Apps

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push image via ACR (builds remotely — no registry credential needed here)
        run: |
          az acr build \
            --registry fitnesscoachacr \
            --image fitness-coach-api:${{ github.sha }} \
            --image fitness-coach-api:latest \
            --file apps/api/Dockerfile \
            .

      - name: Deploy new image to Container App
        run: |
          az containerapp update \
            --name fitness-coach-api \
            --resource-group fitness-app \
            --image fitnesscoachacr.azurecr.io/fitness-coach-api:${{ github.sha }}
