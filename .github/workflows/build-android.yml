name: Build Android APK (EAS cloud build)

# Submits the build to EAS's cloud builders and waits for the result, so the
# build is visible in the Expo dashboard and downloadable from there.
#
# This previously ran `eas build --local`, compiling on the GitHub runner to
# avoid the EAS queue. That turned out not to work for this app: GitHub's
# hosted runners are 2-core/7GB, and the release lint pass
# (:expo-modules-core:lintVitalAnalyzeRelease) exhausted the JVM metaspace.
# An earlier run on the same setup hung until GitHub's 6-hour ceiling killed
# it. EAS's builders are provisioned for Android compilation and do not hit
# either problem.
#
# Requires a repository secret named EXPO_TOKEN, from an account that owns
# (or has been granted access to) the EAS project in apps/mobile/app.json.
# A token that is valid but belongs to a different account fails with
# "Entity not authorized: AppEntity[...]" — that is a permissions problem,
# not a bad token.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile (apps/mobile/eas.json)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - development

jobs:
  build-android:
    runs-on: ubuntu-latest
    # Generous, because this waits on EAS's queue as well as the build. It
    # exists so a stuck run fails in an hour rather than sitting on GitHub's
    # default 6-hour ceiling, which a previous run did.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No Java or Android SDK setup: compilation happens on EAS, and this
      # job only needs enough Node to run the CLI.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Build Android APK on EAS
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --platform android \
            --profile ${{ github.event.inputs.profile }} \
            --non-interactive \
            --wait

      - name: Show where to download the build
        if: always()
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build:list --platform android --limit 1 --non-interactive || true
